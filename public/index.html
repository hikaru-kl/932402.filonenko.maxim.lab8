<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея фотографий</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><a class="brand" href="/">Галерея фотографий</a></header>
  <main class="container">
    <p class="eyebrow">PHOTO STORIES</p>
    <h1>Альбомы</h1>
    <form id="album-form" class="album-form">
      <label for="album-name">Название нового альбома</label>
      <input id="album-name" name="name" required>
      <button>Добавить альбом</button>
    </form>
    <p id="message" role="status"></p>
    <div id="albums" class="album-list"></div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
